[databases]
mpgsql = host=postgres port=5432 dbname=mpgsql

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
default_pool_size = 2
reserve_pool_size = 0
max_client_conn = 100
max_prepared_statements = 100
server_reset_query = DISCARD ALL
admin_users = mpgsql
